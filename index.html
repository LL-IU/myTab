<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="favicon.ico">
    <title>My-Tab</title>
</head>

<body>
    <img src="bg.jpg" alt="" class="focus" id="bg">
    <!-- oncontextmenu="return false" -->
    <!-- <div class="cover"></div> -->
    <!-- 时间区域，目前用来放logo -->
    <!-- <img src="logo.png" alt="" id="logo"> -->
    <div class="timeBox">
        <h2 id="logo">DESTIN</h2>
    </div>
    <!-- 搜索框 -->
    <div class="container" id="container">
        <i class="fa-brands fa-windows item" id="itema"><img src="baidu.png" alt=""></i>
        <input type="text" id="search-btn" class="search-btn" placeholder="搜索" autocomplete="off" onfocus="add()"
            onblur="remove()">
        <button class="fa-solid fa-magnifying-glass item" id="itemb" onclick="myClick()"><img src="search.png" alt="">
        </button>

    </div>
    <!-- 联想词 -->
    <div id="relebox">
        <ul id="relevance"></ul>
    </div>
    <!-- 右键菜单 -->
    <ul class="myul" id="myul">
        <li id="myli">网址<input type="text" id="linkInput" autocomplete="off"></li>
        <li id="myli">图标<input type="text" id="iconInput" autocomplete="off">
            <input type="file" id="iconSelect">
            <div id="iconButton"></div>
        </li>
    </ul>
    <!-- 右键选择背景 -->
    <div id="bgChangeMenu">
        <input type="file" id="bgSelect">
        <div id="bgSelectButton" class="bgOption">
            <p>选择背景</p>
        </div>
        <div id="bgClear" class="bgOption" onclick="bgClear()">清除背景</div>
        <div id="hideLink" class="bgOption" onclick="hideLink()">显隐链接</div>
    </div>
    <!-- 快捷链接 -->
    <div id="quickLink"><!-- 左键单击判断有没有url，没有创建，有跳转 ,先不要img，用js添加-->
